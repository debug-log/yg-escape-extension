name: Test and release
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python scripts/package.py
      - run: node tests/run-date-unlock-chrome.cjs
      - run: node tests/run-play33-chrome.cjs
      - run: node tests/run-update-chrome.cjs
      - run: node tests/run-update-chrome.cjs
        env:
          XRE_UPDATE_PARTIAL_TEST: '1'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned ZIP
        run: python scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --generate-notes
          fi
